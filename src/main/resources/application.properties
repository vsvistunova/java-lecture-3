spring.application.name=java-lecture-3

server.port=8081
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/example_db}
spring.datasource.username=${JDBC_USERNAME:example_name}
spring.datasource.password=${JDBC_PASSWORD:example_pass}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

logging.level.org.hibernate.orm.jdbc.bind=TRACE